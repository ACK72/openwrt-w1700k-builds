name: Release W1700K ubi2-oc

on:
  schedule:
    - cron: '17 18 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml', 'scripts/**', 'configs/**', 'package/**', 'patches/**']
  workflow_dispatch:
    inputs:
      runner:
        description: Build host (independent caches per architecture)
        default: ubuntu-24.04
        type: choice
        options: [ubuntu-24.04, ubuntu-24.04-arm]
      force:
        description: Build another release even if these inputs are already published
        default: false
        type: boolean
      clean:
        description: Rebuild tools, toolchain, kernel and packages without compiler/build caches
        default: false
        type: boolean

permissions:
  contents: read

# Serialize both host architectures, including publication and retention.
concurrency:
  group: w1700k-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    env:
      OPENWRT_REF: ubi2-oc
      NPU_REF: main
      CCACHE_MAXSIZE: 3G
    outputs:
      built: ${{ steps.firmware.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify host cache namespace
        run: echo "CACHE_PREFIX=w1700k-v2-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_ENV"
      - name: Validate release builder
        run: |
          python3 -B -m unittest discover -s tests -v
          for script in tests/*.sh; do bash "$script"; done
      - name: Reclaim space only when needed
        run: |
          available=$(df --output=avail -BG . | tail -1 | tr -dc '0-9')
          if (( available < 30 )); then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          fi
          df -h .
      - name: Install build dependencies
        run: bash scripts/install-deps.sh
      - name: Resolve exact source revisions
        id: sources
        run: |
          bash scripts/build.sh prepare
          cat .work/sources.env >> "$GITHUB_OUTPUT"
      - name: Restore paired NPU firmware
        id: npu
        if: inputs.clean != true
        uses: actions/cache/restore@v4
        with:
          path: .cache/npu
          key: ${{ env.CACHE_PREFIX }}-npu-${{ steps.sources.outputs.npu-key }}
      - name: Build and verify paired NPU firmware
        run: bash scripts/build.sh npu
      - name: Save paired NPU firmware
        if: steps.npu.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/npu
          key: ${{ env.CACHE_PREFIX }}-npu-${{ steps.sources.outputs.npu-key }}
      - name: Resolve feeds and validate release configuration
        id: keys
        run: |
          bash scripts/build.sh configure
          cat .work/keys.env >> "$GITHUB_OUTPUT"
      - name: Check for an already published release
        id: needed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FINGERPRINT: ${{ steps.keys.outputs.fingerprint }}
          FORCE: ${{ inputs.force || inputs.clean }}
        run: |
          decision=$(bash scripts/should-build.sh)
          echo "$decision" >> "$GITHUB_OUTPUT"
          if [[ "$decision" == build=false ]]; then
            echo 'These exact build inputs already have a downloadable release; compilation was skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Restore source downloads
        if: steps.needed.outputs.build == 'true'
        id: dl
        uses: actions/cache/restore@v4
        with:
          path: .cache/dl
          key: ${{ env.CACHE_PREFIX }}-dl-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.CACHE_PREFIX }}-dl-
      - name: Restore compiler cache
        if: steps.needed.outputs.build == 'true' && inputs.clean != true
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .cache/ccache
          key: ${{ env.CACHE_PREFIX }}-ccache-${{ steps.keys.outputs.toolchain }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-ccache-${{ steps.keys.outputs.toolchain }}-
            ${{ env.CACHE_PREFIX }}-ccache-
      - name: Restore compatible kernel and package build state
        if: steps.needed.outputs.build == 'true' && inputs.clean != true
        id: buildcache
        uses: actions/cache/restore@v4
        with:
          path: .cache/build
          key: ${{ env.CACHE_PREFIX }}-build-${{ steps.keys.outputs.build }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.CACHE_PREFIX }}-build-${{ steps.keys.outputs.build }}-
      - name: Restore compatible toolchain when no full build state exists
        if: steps.needed.outputs.build == 'true' && inputs.clean != true && steps.buildcache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: .cache/toolchain
          key: ${{ env.CACHE_PREFIX }}-toolchain-${{ steps.keys.outputs.toolchain }}
      - name: Restore build products before make download
        if: steps.needed.outputs.build == 'true'
        id: restored
        run: |
          bash scripts/build.sh restore
          kind=none
          if [[ -f .work/cache-restored ]]; then kind=$(cat .work/cache-restored); fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Build state restored: $kind" >> "$GITHUB_STEP_SUMMARY"
      - name: Download sources in parallel
        if: steps.needed.outputs.build == 'true'
        run: bash scripts/build.sh download
      - name: Build missing tools and toolchain
        if: steps.needed.outputs.build == 'true'
        id: tools
        run: bash scripts/build.sh toolchain
      - name: Save successful toolchain before firmware compilation
        if: steps.tools.outcome == 'success' && steps.restored.outputs.kind == 'none'
        uses: actions/cache/save@v4
        with:
          path: .cache/toolchain
          key: ${{ env.CACHE_PREFIX }}-toolchain-${{ steps.keys.outputs.toolchain }}
      - name: Compile release firmware
        if: steps.needed.outputs.build == 'true'
        run: bash scripts/build.sh compile
      - name: Validate and collect firmware, matching APKs and provenance
        if: steps.needed.outputs.build == 'true'
        id: collect
        run: |
          bash scripts/build.sh collect
          echo "artifact-path=$(cat .work/artifact-path)" >> "$GITHUB_OUTPUT"
          cat .work/build-state.json >> "$GITHUB_STEP_SUMMARY"
          cat logs/timings.tsv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validated release payload
        if: steps.collect.outcome == 'success'
        id: firmware
        uses: actions/upload-artifact@v4
        with:
          name: w1700k-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect.outputs.artifact-path }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Snapshot successful kernel and package build state
        if: steps.firmware.outcome == 'success'
        id: snapshot
        continue-on-error: true
        run: bash scripts/build.sh snapshot
      - name: Save successful incremental build state
        if: steps.snapshot.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/build
          key: ${{ env.CACHE_PREFIX }}-build-${{ steps.keys.outputs.build }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save reusable downloads
        if: always() && steps.dl.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/dl
          key: ${{ env.CACHE_PREFIX }}-dl-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save compiler cache, including clean builds
        if: always() && steps.tools.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/ccache
          key: ${{ env.CACHE_PREFIX }}-ccache-${{ steps.keys.outputs.toolchain }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain only caches whose replacement was successfully saved
        if: always() && steps.needed.outputs.build == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOOLCHAIN_KEY: ${{ steps.keys.outputs.toolchain }}
          BUILD_KEY: ${{ steps.keys.outputs.build }}
          NPU_KEY: ${{ steps.sources.outputs.npu-key }}
        run: python3 scripts/prune-caches.py
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            .work/openwrt/logs/
            .work/build-state.json
            .work/sources.env
            .work/feeds.lock
            .work/requested.config
            .work/openwrt/feeds.conf
            .work/openwrt/.config
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: always() && !cancelled() && needs.build.outputs.built == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: w1700k-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload
      - name: Publish complete release and retain the latest three
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release.py publish release-payload release-assets
