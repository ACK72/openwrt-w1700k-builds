name: Build W1700K OC RC

on:
  schedule:
    - cron: '17 18 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml', '.github/actions/**', 'scripts/**', 'configs/**', 'package/**', 'patches/**', 'LICENSES/**', 'containers/**', '.dockerignore']
  workflow_dispatch:
    inputs:
      refresh_environment:
        description: Refresh Ubuntu build dependencies and invalidate affected toolchains
        default: false
        type: boolean
      force:
        description: Build another release even if these inputs are already published
        default: false
        type: boolean
      clean:
        description: Rebuild tools, toolchain, kernel and packages without compiler/build caches
        default: false
        type: boolean

permissions:
  contents: read

# Serialize environment refresh, cache publication, RC builds and stable promotion.
concurrency:
  group: w1700k-release
  cancel-in-progress: false

jobs:
  environment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate environment registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Resolve or build the persistent ARM64 environment
        id: image
        env:
          REFRESH_ENVIRONMENT: ${{ inputs.refresh_environment || false }}
        run: bash scripts/build-environment.sh

  compose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      source: ${{ steps.stack.outputs.source }}
      artifact-name: source-stack-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Compose official main, fanboy ubi2-oc and W1700K patches
        id: stack
        env:
          OPENWRT_SSH_KEY: ${{ secrets.OPENWRT_SSH_KEY }}
        run: |
          test -n "$OPENWRT_SSH_KEY" || { echo 'Configure the source deploy key in OPENWRT_SSH_KEY first.' >&2; exit 1; }
          python3 scripts/source-stack.py .work/source-stack .work/source-stack.json --publish
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: source-stack-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/source-stack.json
          retention-days: 90
          if-no-files-found: error

  clean-drafts:
    needs: compose
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Remove drafts left by previous builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release.py clean-drafts

  build:
    if: github.ref == 'refs/heads/main'
    needs: [environment, compose, clean-drafts]
    runs-on: ubuntu-24.04-arm
    # Hosted jobs stop at 360 minutes. make stops at BUILD_DEADLINE instead, so
    # an overlong build still preserves its caches and partial state.
    timeout-minutes: 355
    container:
      image: ${{ needs.environment.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: write
      packages: write
    env:
      OPENWRT_REF: ${{ needs.compose.outputs.source }}
      CCACHE_MAXSIZE: 3G
      BUILD_ENVIRONMENT: ${{ needs.environment.outputs.image }}
      CLEAN_BUILD: ${{ inputs.clean || false }}
    outputs:
      built: ${{ steps.firmware.outcome == 'success' }}
      artifact-name: ${{ steps.collect.outputs.artifact-name }}
      build-attempt: ${{ steps.collect.outputs.build-attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Identify host cache namespace and reserve preservation time
        run: |
          {
            echo "CACHE_PREFIX=w1700k-v3-Linux-ARM64"
            # Leave 35 minutes for stopping make and saving every cache.
            echo "BUILD_DEADLINE=$(( $(date +%s) + 320 * 60 ))"
          } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.compose.outputs.artifact-name }}
          path: .work
      - name: Validate release builder
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m compileall -q scripts
          node --check package/w1700k-custom/overview.js
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = aarch64
          test "$("$GOLANG_BOOTSTRAP_ROOT/bin/go" env GOHOSTOS GOHOSTARCH | paste -sd /)" = linux/arm64
          "$GOLANG_BOOTSTRAP_ROOT/bin/go" version
          gh --version
          gh api --paginate --slurp "repos/$GH_REPO/actions/caches?per_page=100" > .work/cache-inventory.json
          python3 -c 'import json; pages=json.load(open(".work/cache-inventory.json")); print("Cache API verified:", sum(len(p["actions_caches"]) for p in pages), "entries")'
      - name: Reclaim space only when needed
        run: |
          available=$(df --output=avail -BG . | tail -1 | tr -dc '0-9')
          if (( available < 30 )); then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          fi
          df -h .
      - name: Authenticate recovery storage
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Pin the official snapshot image
        id: official
        run: python3 scripts/distfeeds.py resolve .work/distfeeds-source.json >> "$GITHUB_OUTPUT"
      - name: Restore extracted official feeds
        id: distfeeds-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .cache/distfeeds
          key: ${{ steps.official.outputs.cache-key }}
      - name: Extract or validate the pinned official feeds
        run: python3 scripts/distfeeds.py prepare .work/distfeeds-source.json .cache/distfeeds
      - name: Save the small extracted feed cache
        if: steps.distfeeds-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./.github/actions/save-cache
        with:
          kind: distfeeds
          path: .cache/distfeeds
          key: ${{ steps.official.outputs.cache-key }}
      - name: Resolve exact source revisions
        id: sources
        run: |
          bash scripts/build.sh prepare
          cat .work/sources.env >> "$GITHUB_OUTPUT"
      - name: Resolve feeds and validate release configuration
        id: keys
        run: |
          bash scripts/build.sh configure
          cat .work/keys.env >> "$GITHUB_OUTPUT"
      - name: Check for an already published release
        id: needed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FINGERPRINT: ${{ steps.keys.outputs.fingerprint }}
          FORCE: ${{ inputs.force || inputs.clean }}
        run: |
          decision=$(bash scripts/should-build.sh)
          echo "$decision" >> "$GITHUB_OUTPUT"
          if [[ "$decision" == build=false ]]; then
            echo 'These exact build inputs already have a downloadable release; compilation was skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Restore source downloads
        if: steps.needed.outputs.build == 'true'
        id: dl
        continue-on-error: true
        uses: actions/cache/restore@v6.1.0
        with:
          path: .cache/dl
          key: ${{ env.CACHE_PREFIX }}-dl-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-dl-
      # ccache hashes the compiler itself; its key only has to change with the
      # compiler, not with every toolchain snapshot. The second prefix reads
      # caches saved before compiler keys existed (same toolchain, same compiler).
      - name: Restore compiler cache
        if: steps.needed.outputs.build == 'true' && inputs.clean != true
        id: ccache
        continue-on-error: true
        uses: actions/cache/restore@v6.1.0
        with:
          path: .cache/ccache
          key: ${{ env.CACHE_PREFIX }}-ccache-${{ steps.keys.outputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-ccache-${{ steps.keys.outputs.compiler }}-
            ${{ env.CACHE_PREFIX }}-ccache-${{ steps.keys.outputs.toolchain }}-
      - name: Restore compatible toolchain
        if: steps.needed.outputs.build == 'true' && inputs.clean != true
        id: toolcache
        continue-on-error: true
        uses: actions/cache/restore@v6.1.0
        with:
          path: .cache/toolchain
          key: ${{ env.CACHE_PREFIX }}-toolchain-${{ steps.keys.outputs.toolchain }}-dl1
          restore-keys: ${{ env.CACHE_PREFIX }}-toolchain-${{ steps.keys.outputs.toolchain }}
      - name: Restore compatible kernel and package build state
        if: steps.needed.outputs.build == 'true' && inputs.clean != true
        id: buildcache
        continue-on-error: true
        uses: actions/cache/restore@v6.1.0
        with:
          path: .cache/build
          key: ${{ env.CACHE_PREFIX }}-build-${{ steps.keys.outputs.build }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.CACHE_PREFIX }}-build-${{ steps.keys.outputs.build }}-
      - name: Recover the compiler cache from the registry when Actions has no copy
        if: steps.needed.outputs.build == 'true' && inputs.clean != true && steps.ccache.outputs.cache-matched-key == ''
        run: >-
          python3 scripts/cache-seed.py restore ccache '${{ steps.keys.outputs.compiler }}' .cache/ccache
          --legacy '${{ steps.keys.outputs.toolchain }}'
      - name: Recover source downloads from the registry when Actions has no copy
        if: steps.needed.outputs.build == 'true' && steps.dl.outputs.cache-matched-key == ''
        run: python3 scripts/cache-seed.py restore dl - .cache/dl --legacy '${{ steps.keys.outputs.toolchain }}'
      - name: Restore build products before make download
        if: steps.needed.outputs.build == 'true'
        id: restored
        run: |
          bash scripts/build.sh restore
          kind=none
          if [[ -f .work/cache-restored ]]; then kind=$(cat .work/cache-restored); fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Build state restored: $kind" >> "$GITHUB_STEP_SUMMARY"
      - name: Retire obsolete architecture caches after successful recovery
        if: steps.restored.outputs.kind != 'none' && steps.restored.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/prune-caches.py retire-legacy
      - name: Download sources in parallel
        if: steps.needed.outputs.build == 'true'
        run: bash scripts/build.sh download
      - name: Build missing tools and toolchain
        if: steps.needed.outputs.build == 'true'
        id: tools
        run: bash scripts/build.sh toolchain
      - name: Save successful toolchain before firmware compilation
        if: steps.tools.outcome == 'success'
        uses: ./.github/actions/save-cache
        with:
          kind: toolchain
          path: .cache/toolchain
          key: ${{ env.CACHE_PREFIX }}-toolchain-${{ steps.keys.outputs.toolchain }}-dl1
      - name: Keep the immutable toolchain in the registry
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/cache-seed.py publish toolchain '${{ steps.keys.outputs.toolchain }}' .cache/toolchain
      - name: Compile RC firmware
        if: steps.needed.outputs.build == 'true'
        id: compile
        run: bash scripts/build.sh compile
      - name: Validate firmware and preserve build provenance
        if: steps.needed.outputs.build == 'true'
        id: collect
        run: |
          bash scripts/build.sh collect
          {
            echo "artifact-path=$(cat .work/artifact-path)"
            echo "artifact-name=w1700k-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "build-attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          cat .work/build-state.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validated release payload
        if: steps.collect.outcome == 'success'
        id: firmware
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.collect.outputs.artifact-name }}
          path: ${{ steps.collect.outputs.artifact-path }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      # Everything below also runs after a failure, a timeout or a cancellation.
      # docker exec does not stop a cancelled step inside the job container, so
      # stop make first: caches must never be archived while it still writes.
      - name: Stop an interrupted build before preserving its state
        if: always() && steps.needed.outputs.build == 'true'
        id: stop
        run: |
          bash scripts/build.sh stop
          echo "downloads-changed=$(bash scripts/build.sh downloads-changed)" >> "$GITHUB_OUTPUT"
      - name: Save compiler cache, including failed and cancelled builds
        if: >-
          always() && steps.stop.outcome == 'success' &&
          contains(fromJSON('["success", "failure", "cancelled"]'), steps.tools.outcome)
        id: ccache-save
        continue-on-error: true
        uses: ./.github/actions/save-cache
        with:
          kind: ccache
          path: .cache/ccache
          key: ${{ env.CACHE_PREFIX }}-ccache-${{ steps.keys.outputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Snapshot build state for the next run
        if: >-
          always() && steps.stop.outcome == 'success' && (
          contains(fromJSON('["success", "failure", "cancelled"]'), steps.compile.outcome) ||
          contains(fromJSON('["failure", "cancelled"]'), steps.tools.outcome))
        id: snapshot
        continue-on-error: true
        env:
          FIRMWARE: ${{ steps.firmware.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
        run: |
          rm -f .work/partial-snapshot
          if [[ $FIRMWARE == success ]]; then
            bash scripts/build.sh snapshot
            echo kind=build >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only verified firmware produces a complete snapshot. Any other
          # progress is resumed by OpenWrt's stamps and never published.
          if [[ -n $COMPILE && $COMPILE != skipped ]]; then
            bash scripts/build.sh snapshot-partial build
          else
            bash scripts/build.sh snapshot-partial toolchain
          fi
          kind=none
          if [[ -f .work/partial-snapshot ]]; then kind=$(cat .work/partial-snapshot); fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [[ $kind != none ]]; then
            echo "Partial $kind state preserved. If a failure repeats from it, rerun with clean=true." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save kernel and package build state
        if: always() && steps.snapshot.outputs.kind == 'build'
        id: build-save
        continue-on-error: true
        uses: ./.github/actions/save-cache
        with:
          kind: build
          path: .cache/build
          key: ${{ env.CACHE_PREFIX }}-build-${{ steps.keys.outputs.build }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save interrupted toolchain progress
        if: always() && steps.snapshot.outputs.kind == 'toolchain'
        continue-on-error: true
        uses: ./.github/actions/save-cache
        with:
          kind: toolchain
          path: .cache/toolchain
          key: ${{ env.CACHE_PREFIX }}-toolchain-${{ steps.keys.outputs.toolchain }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save reusable downloads when they changed
        if: >-
          always() && steps.dl.outcome == 'success' && steps.stop.outcome == 'success' &&
          (steps.dl.outputs.cache-matched-key == '' || steps.stop.outputs.downloads-changed == 'true')
        id: dl-save
        continue-on-error: true
        uses: ./.github/actions/save-cache
        with:
          kind: dl
          path: .cache/dl
          key: ${{ env.CACHE_PREFIX }}-dl-${{ github.run_id }}-${{ github.run_attempt }}
      # The container package keeps copies outside the 10 GB Actions cache:
      # refreshed when missing or stale, and at once when Actions refused them.
      # A complete build snapshot is only kept there as budget overflow.
      - name: Refresh registry copies of the caches
        if: always() && steps.stop.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOOLCHAIN_KEY: ${{ steps.keys.outputs.toolchain }}
          COMPILER_KEY: ${{ steps.keys.outputs.compiler }}
          BUILD_KEY: ${{ steps.keys.outputs.build }}
          CCACHE_SAVE: ${{ steps.ccache-save.outcome }}
          CCACHE_RESERVED: ${{ steps.ccache-save.outputs.reserved }}
          DL_SAVE: ${{ steps.dl-save.outcome }}
          DL_RESERVED: ${{ steps.dl-save.outputs.reserved }}
          SNAPSHOT: ${{ steps.snapshot.outputs.kind }}
          FIRMWARE: ${{ steps.firmware.outcome }}
          BUILD_RESERVED: ${{ steps.build-save.outputs.reserved }}
        run: |
          if [[ -n $CCACHE_SAVE && $CCACHE_SAVE != skipped ]]; then
            force=(); [[ $CCACHE_RESERVED == true ]] || force=(--force)
            python3 scripts/cache-seed.py publish ccache "$COMPILER_KEY" .cache/ccache --max-age 3 "${force[@]}"
          fi
          if [[ -n $DL_SAVE && $DL_SAVE != skipped ]]; then
            force=(); [[ $DL_RESERVED == true ]] || force=(--force)
            python3 scripts/cache-seed.py publish dl - .cache/dl --max-age 7 "${force[@]}"
          fi
          if [[ $SNAPSHOT == build && $FIRMWARE == success && $BUILD_RESERVED != true ]]; then
            python3 scripts/cache-seed.py publish build "$BUILD_KEY" .cache/build --force
          fi
          python3 scripts/prune-registry.py
      - name: Report build timings even on failure
        if: always()
        run: |
          if [[ -f logs/timings.tsv ]]; then
            {
              printf '\n| Phase | Seconds | Exit code |\n| --- | ---: | ---: |\n'
              awk -F '\t' '{printf "| %s | %s | %s |\n", $1, $2, $3}' logs/timings.tsv
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain only caches whose replacement was successfully saved
        if: always() && steps.official.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOOLCHAIN_KEY: ${{ steps.keys.outputs.toolchain }}
          COMPILER_KEY: ${{ steps.keys.outputs.compiler }}
          BUILD_KEY: ${{ steps.keys.outputs.build }}
          BUILD_BASE_KEY: ${{ steps.keys.outputs.build-base }}
          DISTFEEDS_CACHE_KEY: ${{ steps.official.outputs.cache-key }}
        run: python3 scripts/prune-caches.py
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            .work/openwrt/logs/
            .work/build-state.json
            .work/cache-budget.json
            .work/cache-inventory.json
            .work/source-stack.json
            .work/sources.env
            .work/feeds.lock
            .work/extra-packages.json
            .work/feed-packages.txt
            .work/distfeeds-source.json
            .work/distfeeds.json
            .work/openwrt/files/etc/apk/repositories.d/distfeeds.list
            .work/openwrt/files/etc/vermagic.txt
            .work/requested.config
            .work/openwrt/feeds.conf
            .work/openwrt/.config
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: needs.build.result == 'success' && needs.build.outputs.built == 'true'
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: release-payload
      - name: Publish RC prerelease and retain one image per channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ATTEMPT: ${{ needs.build.outputs.build-attempt }}
        run: python3 scripts/release.py publish release-payload release-assets
